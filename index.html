<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#FFFFFF" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FleteApp" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <title>FleteApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">

    <!-- ── Header ─────────────────────────────── -->
    <header class="header">
      <span class="logo">FLETE<span class="logo-dot">.</span>APP</span>
      <div class="avatar" role="img" aria-label="Avatar del transportista">FC</div>
    </header>

    <!-- ── Contenido scrolleable ──────────────── -->
    <main class="main" id="view-cotizar">

      <!-- Config card -->
      <div class="config-card">
        <div class="config-field">
          <label for="cfg-tarifa">Tarifa / km</label>
          <div class="config-value-wrap">
            <span class="config-sym" aria-hidden="true">$</span>
            <input id="cfg-tarifa" type="number" value="850" inputmode="numeric" pattern="[0-9]*"
                   aria-label="Tarifa por kilómetro en pesos" />
          </div>
        </div>

        <div class="config-divider" aria-hidden="true"></div>

        <div class="config-field">
          <label for="cfg-distancia">Distancia</label>
          <div class="config-value-wrap">
            <input id="cfg-distancia" type="number" value="25" inputmode="numeric" pattern="[0-9]*"
                   aria-label="Distancia en kilómetros" />
            <span class="config-sym" aria-hidden="true">km</span>
          </div>
        </div>

        <div class="config-divider" aria-hidden="true"></div>

        <div class="config-field">
          <label for="cfg-capacidad">Camión m³</label>
          <div class="config-value-wrap">
            <input id="cfg-capacidad" type="number" value="20" inputmode="numeric" pattern="[0-9]*"
                   aria-label="Capacidad del camión en metros cúbicos" />
          </div>
        </div>
      </div>

      <!-- Config extra: costos adicionales -->
      <div class="config-extra">
        <div class="config-extra-field">
          <label for="input-bencina-litro">$/L bencina</label>
          <input id="input-bencina-litro" type="number" value="0" inputmode="numeric" pattern="[0-9]*"
                 aria-label="Precio por litro de bencina" />
        </div>
        <div class="config-divider" aria-hidden="true"></div>
        <div class="config-extra-field">
          <label for="input-bencina-rendimiento">km / litro</label>
          <input id="input-bencina-rendimiento" type="number" value="0" inputmode="numeric" pattern="[0-9]*"
                 aria-label="Rendimiento en kilómetros por litro" />
        </div>
        <div class="config-divider" aria-hidden="true"></div>
        <div class="config-extra-field">
          <label for="input-peajes">Peajes $</label>
          <input id="input-peajes" type="number" value="0" inputmode="numeric" pattern="[0-9]*"
                 aria-label="Costo total de peajes" />
        </div>
      </div>

      <!-- Label sección artículos -->
      <p class="section-label">Artículos</p>

      <!-- Tabs de categoría -->
      <div class="tabs" role="tablist">
        <button class="tab active" data-cat="todos"      role="tab" aria-selected="true">Todos</button>
        <button class="tab"        data-cat="dormitorio" role="tab" aria-selected="false">Dormitorio</button>
        <button class="tab"        data-cat="living"     role="tab" aria-selected="false">Living</button>
        <button class="tab"        data-cat="cocina"     role="tab" aria-selected="false">Cocina</button>
        <button class="tab"        data-cat="lavadero"   role="tab" aria-selected="false">Lavadero</button>
        <button class="tab"        data-cat="despacho"   role="tab" aria-selected="false">Despacho</button>
        <button class="tab"        data-cat="terraza"    role="tab" aria-selected="false">Terraza</button>
        <button class="tab"        data-cat="cajas"      role="tab" aria-selected="false">Cajas</button>
      </div>

      <!-- Lista de artículos (renderizada por app.js) -->
      <div class="articles" id="articles-list" role="list"></div>

      <!-- Label sección resumen -->
      <p class="section-label top-gap">Resumen</p>

      <!-- Tarjeta de resumen -->
      <div class="summary-card">

        <div class="summary-count" id="summary-items">0 artículos seleccionados</div>

        <div class="summary-occupancy">
          <div class="occupancy-header">
            <span class="occupancy-label">Ocupación del camión</span>
            <span class="occupancy-pct" id="occupancy-pct">0%</span>
          </div>
          <div class="occupancy-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
            <div class="occupancy-fill" id="occupancy-fill"></div>
          </div>
        </div>

        <div class="summary-rows">
          <div class="summary-row">
            <span class="summary-row-label">Volumen total</span>
            <span class="summary-row-value" id="stat-volume">0.00 m³</span>
          </div>
          <div class="summary-row">
            <span class="summary-row-label">Costo estimado</span>
            <span class="summary-row-value accent" id="stat-costo">$0</span>
          </div>
          <div class="summary-row last">
            <span class="summary-row-label">Distancia</span>
            <span class="summary-row-value" id="stat-distancia">25 km</span>
          </div>
        </div>

      </div>

      <!-- Alerta exceso capacidad -->
      <div id="alerta-exceso" class="hidden" role="alert">
        <span aria-hidden="true">⚠</span> Excede la capacidad — puedes continuar agregando
      </div>

      <!-- Cliente (opcional) -->
      <div class="cliente-row">
        <input id="input-cliente" type="text" placeholder="Cliente (opcional)"
               autocomplete="off" spellcheck="false"
               aria-label="Nombre del cliente para la cotización" />
      </div>

      <!-- Acciones -->
      <div class="action-row">
        <button class="btn-total" id="btn-compartir" aria-label="Compartir cotización">
          <span class="btn-total-label">Total estimado</span>
          <span class="btn-total-price" id="btn-total-price">$0</span>
        </button>
        <button class="btn-share" aria-label="Compartir cotización">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="18" cy="5"  r="3"/>
            <circle cx="6"  cy="12" r="3"/>
            <circle cx="18" cy="19" r="3"/>
            <line x1="8.59"  y1="13.51" x2="15.42" y2="17.49"/>
            <line x1="15.41" y1="6.51"  x2="8.59"  y2="10.49"/>
          </svg>
        </button>
      </div>
      <div class="action-secondary">
        <button id="btn-limpiar">Limpiar todo</button>
      </div>

      <div class="scroll-spacer"></div>
    </main>

    <!-- ── Vista: Perfil ────────────────────── -->
    <div id="view-perfil" class="main hidden" aria-label="Perfil">

      <p class="section-label" style="margin-top:4px;">Tus datos</p>
      <div class="config-card">
        <div class="config-field">
          <label for="prof-nombre">Nombre</label>
          <input id="prof-nombre" type="text" placeholder="Tu nombre"
                 autocomplete="given-name" aria-label="Tu nombre" spellcheck="false" />
        </div>
      </div>

      <p class="section-label top-gap">Tu camión</p>
      <div class="config-card">
        <div class="config-field">
          <label for="prof-tarifa">Tarifa / km</label>
          <div class="config-value-wrap">
            <span class="config-sym" aria-hidden="true">$</span>
            <input id="prof-tarifa" type="number" value="850"
                   inputmode="numeric" pattern="[0-9]*"
                   aria-label="Tarifa base por kilómetro" />
          </div>
        </div>
        <div class="config-divider" aria-hidden="true"></div>
        <div class="config-field">
          <label for="prof-capacidad">Capacidad</label>
          <div class="config-value-wrap">
            <input id="prof-capacidad" type="number" value="20"
                   inputmode="numeric" pattern="[0-9]*"
                   aria-label="Capacidad del camión en metros cúbicos" />
            <span class="config-sym" aria-hidden="true">m³</span>
          </div>
        </div>
      </div>

      <p class="section-label top-gap">Combustible</p>
      <div class="config-extra standalone">
        <div class="config-extra-field">
          <label for="prof-bencina">$/L bencina</label>
          <input id="prof-bencina" type="number" value="0"
                 inputmode="numeric" pattern="[0-9]*"
                 aria-label="Precio por litro de bencina" />
        </div>
        <div class="config-divider" aria-hidden="true"></div>
        <div class="config-extra-field">
          <label for="prof-rendimiento">km / litro</label>
          <input id="prof-rendimiento" type="number" value="0"
                 inputmode="numeric" pattern="[0-9]*"
                 aria-label="Rendimiento en kilómetros por litro" />
        </div>
      </div>

      <p class="section-label top-gap">Historial</p>
      <div class="historial-list" id="historial-list" aria-label="Historial de cotizaciones">
        <!-- Renderizado por JS -->
      </div>

      <div class="scroll-spacer"></div>
    </div>

    <!-- ── Barra de resumen fija ─────────────── -->
    <div class="summary-bar" aria-label="Resumen de cotización" aria-live="polite">
      <div class="sbar-item">
        <span class="sbar-label">Volumen</span>
        <span class="sbar-value" id="sbar-volume">0.00 m³</span>
      </div>
      <div class="sbar-divider" aria-hidden="true"></div>
      <div class="sbar-item">
        <span class="sbar-label">Ocupación</span>
        <span class="sbar-value" id="sbar-pct">0%</span>
      </div>
      <div class="sbar-divider" aria-hidden="true"></div>
      <div class="sbar-item">
        <span class="sbar-label">Total</span>
        <span class="sbar-value accent" id="sbar-total">$0</span>
      </div>
    </div>

    <!-- ── Nav inferior (2 tabs) ──────────────── -->
    <nav class="bottom-nav" aria-label="Navegación principal">

      <button class="nav-item active" id="nav-cotizar" aria-label="Cotizar" aria-current="page">
        <div class="nav-icon-wrap">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="1" y="3" width="15" height="13" rx="1"/>
            <path d="M16 8h4l3 5v3h-7V8z"/>
            <circle cx="5.5"  cy="18.5" r="2.5"/>
            <circle cx="18.5" cy="18.5" r="2.5"/>
          </svg>
          <span class="nav-dot" aria-hidden="true"></span>
        </div>
        <span class="nav-label">Cotizar</span>
        <span class="nav-total" id="nav-total"></span>
      </button>

      <button class="nav-item" id="nav-perfil" aria-label="Mi perfil">
        <div class="nav-icon-wrap">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <span class="nav-dot" aria-hidden="true"></span>
        </div>
        <span class="nav-label">Perfil</span>
      </button>

    </nav>

  </div>

  <script src="js/catalog.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/fletes-app/sw.js');
    }
  </script>
</body>
</html>
